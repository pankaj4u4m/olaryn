<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,440;9..144,500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #211E1B;
    --paper: #F5EFE3;
    --brass: #AD7D4C;
    --mist: #E1D8C5;
    --muted: #7A7367;
  }

  *{ box-sizing: border-box; }
  html, body{ margin: 0; padding: 0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', -apple-system, sans-serif;
  }

  .hero{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(32px, 5vh, 52px) 24px clamp(24px, 3.5vh, 38px);
    text-align: center;
  }

  .mark{
    width: 46px;
    height: 46px;
    margin-bottom: 28px;
  }
  .mark path{
    fill: none;
    stroke: var(--ink);
    stroke-width: 10;
    stroke-linecap: round;
  }
  .mark circle{ fill: var(--brass); }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 440;
    font-size: clamp(38px, 6vw, 58px);
    margin: 0 0 20px;
    letter-spacing: 0.005em;
  }

  .thesis{
    font-family: 'Fraunces', serif;
    font-weight: 440;
    font-size: clamp(24px, 4vw, 34px);
    line-height: 1.25;
    margin: 0 0 18px;
  }

  .lede{
    font-size: 16px;
    color: var(--muted);
    max-width: 46ch;
    line-height: 1.65;
    margin: 0 auto;
  }

  section.products{
    max-width: 760px;
    margin: 0 auto;
    padding: 0 24px clamp(24px, 4vh, 40px);
  }

  .products-head{
    text-align: center;
    margin-bottom: 20px;
  }

  .products-head h2{
    font-family: 'Fraunces', serif;
    font-weight: 440;
    font-size: 26px;
    margin: 0 0 10px;
  }

  .products-head p{
    color: var(--muted);
    font-size: 15px;
    margin: 0;
    max-width: 44ch;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.55;
  }

  .product-list{
    display: flex;
    flex-direction: column;
  }

  .product-row{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    padding: 18px 4px;
    border-top: 1px solid var(--mist);
    text-decoration: none;
    color: inherit;
  }
  .product-row:last-child{
    border-bottom: 1px solid var(--mist);
  }

  .product-row .name{
    font-family: 'Fraunces', serif;
    font-weight: 440;
    font-size: 22px;
    color: var(--ink);
    flex-shrink: 0;
    transition: color 0.15s ease;
  }

  .product-row .blurb{
    font-size: 14.5px;
    color: var(--muted);
    text-align: right;
    line-height: 1.5;
  }

  .product-row:hover .name{ color: var(--brass); text-decoration: underline; text-underline-offset: 4px; }

  @media (max-width: 560px){
    .product-row{ flex-direction: column; align-items: flex-start; gap: 6px; }
    .product-row .blurb{
 text-align: left; }
  }

  footer{
    text-align: center;
    padding: 0 24px clamp(24px, 4vh, 40px);
    font-size: 12.5px;
    color: var(--muted);
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>

  <div class="hero">
    <svg class="mark" viewBox="0 0 100 100">
      <path d="M 82 50 A 32 32 0 1 1 71.5 26.5" />
      <circle cx="71.5" cy="26.5" r="5" />
    </svg>

    <h1>Olaryn</h1>
    <p class="thesis">Learning compounds.</p>
    <p class="lede">What we learn, improve, and create should strengthen everything around it.</p>
  </div>

  <section class="products">
    <div class="products-head">
      <h2>Companies</h2>
    </div>

    <div class="product-list">
      <a class="product-row" href="https://beseam.com" target="_blank" rel="noopener" title="Visit beseam">
        <span class="name">beseam</span>
        <span class="blurb">beseam.com</span>
      </a>
      <a class="product-row" href="https://lemoncrow.com" target="_blank" rel="noopener" title="Visit lemoncrow">
        <span class="name">lemoncrow</span>
        <span class="blurb">lemoncrow.com</span>
      </a>
      <a class="product-row" href="https://usetrevra.com" target="_blank" rel="noopener" title="Visit usetrevra">
        <span class="name">usetrevra</span>
        <span class="blurb">usetrevra.com</span>
      </a>
    </div>
  </section>

  <footer>&copy; 2026 Olaryn · Zürich, Switzerland 🇨🇭</footer>

</body>
</html>
