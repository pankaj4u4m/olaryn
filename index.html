<style>
  :root{
    --ink:#211E1B;
    --paper:#F5EFE3;
    --brass:#AD7D4C;
    --muted:#7A7367;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; }
  body{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans',-apple-system,sans-serif;
  }

  main{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:56px 24px 40px;
    text-align:center;
  }

  .hero{
    width:min(620px,100%);
  }

  .mark{
    width:46px;
    height:46px;
    margin-bottom:26px;
  }
  .mark path{
    fill:none;
    stroke:var(--ink);
    stroke-width:10;
    stroke-linecap:round;
  }
  .mark circle{ fill:var(--brass); }

  h1{
    font-family:'Fraunces',serif;
    font-weight:440;
    font-size:clamp(38px,6vw,58px);
    letter-spacing:.005em;
    margin:0 0 18px;
  }

  .thesis{
    font-family:'Fraunces',serif;
    font-weight:440;
    font-size:clamp(25px,4vw,34px);
    line-height:1.25;
    margin:0 0 18px;
  }

  .lede{
    max-width:46ch;
    margin:0 auto;
    color:var(--muted);
    font-size:16px;
    line-height:1.65;
  }

  footer{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    padding:0 24px 28px;
    color:var(--muted);
    font-size:12.5px;
  }

  .company-links{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
  }

  .company-link{
    width:34px;
    height:34px;
    display:grid;
    place-items:center;
    border-radius:9px;
    opacity:.72;
    transition:opacity .15s ease, transform .15s ease;
  }

  .company-link:hover{
    opacity:1;
    transform:translateY(-1px);
  }

  .company-link:focus-visible{
    outline:1px solid var(--brass);
    outline-offset:4px;
  }

  .company-link img{
    display:block;
    max-width:24px;
    max-height:24px;
    width:auto;
    height:auto;
  }

  .company-link.trevra img{
    width:22px;
    height:22px;
  }

  @media (max-width:560px){
    main{ padding:44px 22px 32px; }
    footer{ padding-bottom:22px; }
  }
</style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="olaryn-title">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M 82 50 A 32 32 0 1 1 71.5 26.5" />
        <circle cx="71.5" cy="26.5" r="5" />
      </svg>

      <h1 id="olaryn-title">Olaryn</h1>
      <p class="thesis">Learning compounds.</p>
      <p class="lede">What we learn, improve, and create should strengthen everything around it.</p>
    </section>
  </main>

  <footer>
    <nav class="company-links" aria-label="Olaryn companies">
      <a class="company-link" href="https://beseam.com" target="_blank" rel="noopener" aria-label="beseam">
        <img src="/assets/companies/beseam.svg" alt="">
      </a>
      <a class="company-link" href="https://lemoncrow.com" target="_blank" rel="noopener" aria-label="lemoncrow">
        <img src="/assets/companies/lemoncrow.svg" alt="">
      </a>
      <a class="company-link trevra" href="https://usetrevra.com" target="_blank" rel="noopener" aria-label="usetrevra">
        <img src="/assets/companies/trevra.svg" alt="">
      </a>
    </nav>
    <div>&copy; 2026 Olaryn · Zürich, Switzerland 🇨🇭</div>
  </footer>
</body>
</html>
